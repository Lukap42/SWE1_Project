components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error400:
      description: Invalid request format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_REQUEST
              message: Invalid request format
              details: {}
    Error401:
      description: Missing or invalid user credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Missing or invalid user credentials
              details: {}
    Error403:
      description: Authenticated user is not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Authenticated user is not permitted
              details: {}
    Error404:
      description: Resource does not exist or is not visible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Resource does not exist or is not visible
              details: {}
    Error409:
      description: Resource/state conflict, including double booking
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: Resource/state conflict, including double booking
              details: {}
    Error422:
      description: Business validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: Business validation failed
              details: {}
    Error503:
      description: Dependency or service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Dependency or service unavailable
              details: {}
  schemas:
    Contact:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 25
        email:
          type: string
          format: email
      required:
      - name
      - phone
      additionalProperties: false
    Address:
      type: object
      properties:
        street:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        postalCode:
          type: string
          minLength: 1
        country:
          type: string
          default: PL
      required:
      - street
      - city
      - postalCode
      - country
      additionalProperties: false
    Dish:
      type: object
      properties:
        dishId:
          type: string
          format: uuid
        name:
          type: string
        priceAmountMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - PLN
        available:
          type: boolean
      required:
      - dishId
      - name
      - priceAmountMinor
      - currency
      - available
      additionalProperties: false
    DishWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        priceAmountMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - PLN
        available:
          type: boolean
      required:
      - name
      - priceAmountMinor
      - currency
      - available
      additionalProperties: false
    DishPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        priceAmountMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - PLN
        available:
          type: boolean
      additionalProperties: false
    OrderItemInput:
      type: object
      properties:
        dishId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - dishId
      - quantity
      additionalProperties: false
    OrderItem:
      type: object
      properties:
        dishId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPriceAmountMinor:
          type: integer
          minimum: 0
      required:
      - dishId
      - name
      - quantity
      - unitPriceAmountMinor
      additionalProperties: false
    OrderCreate:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/Contact'
        paymentMethodToken:
          type: string
          description: Opaque payment method token issued by payment provider; never raw card data.
      required:
      - items
      - deliveryAddress
      - contact
      - paymentMethodToken
      additionalProperties: false
    Order:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - CONFIRMED
          - PREPARING
          - READY
          - COMPLETED
          - CANCELLED
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        totalAmountMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - PLN
        paymentStatus:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
          - REFUNDED
        estimatedDeliveryAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
      - orderId
      - status
      - items
