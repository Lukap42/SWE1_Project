openapi: 3.0.3
info:
  title: Restaurant Management System API
  version: 0.1.0
  description: 'Editable design draft based on SWE1_Project/REST_API_ENDPOINTS.md (38 endpoints). All paths are
    prefixed by /api/v1 using servers.url. Decisions made for consistency: asynchronous payment via pending order
    and signed webhook; public guest booking and ordering; guest lookup with a secret token; generic UUID resource
    IDs; PLN amounts in grosze. Role governance, table-duration policy, cost data sources, delivery failure handling
    and notification channels require team confirmation. The x-required-roles extension is explanatory; implement
    authorization on backend, not in the client.'
servers:
- url: /api/v1
tags:
- name: Menu
- name: Accounts
- name: Orders
- name: Payments
- name: Reservations
- name: Deliveries
- name: Reports
paths:
  /menu:
    get:
      tags:
      - Menu
      summary: List available menu items
      operationId: listMenu
      x-required-roles: Public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dish'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - items
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      security: []
  /menu/{dishId}:
    get:
      tags:
      - Menu
      summary: Get available dish
      operationId: getMenuDish
      x-required-roles: Public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: dishId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security: []
  /menu/items:
    post:
      tags:
      - Menu
      summary: Create menu item
      operationId: createDish
      x-required-roles: RESTAURANT_MANAGER
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishWrite'
      security:
      - bearerAuth: []
  /menu/items/{dishId}:
    patch:
      tags:
      - Menu
      summary: Update menu item
      operationId: updateDish
      x-required-roles: RESTAURANT_MANAGER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishPatch'
      parameters:
      - name: dishId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
    delete:
      tags:
      - Menu
      summary: Remove menu item from live offer (soft delete)
      operationId: deleteDish
      x-required-roles: RESTAURANT_MANAGER
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: dishId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /auth/register:
    post:
      tags:
      - Accounts
      summary: Register customer account
      operationId: registerCustomer
      x-required-roles: Public
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      security: []
  /auth/login:
    post:
      tags:
      - Accounts
      summary: Authenticate and obtain access token
      operationId: login
      x-required-roles: Public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /auth/logout:
    post:
      tags:
      - Accounts
      summary: Invalidate authenticated session
      operationId: logout
      x-required-roles: Authenticated
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      security:
      - bearerAuth: []
  /users/me:
    get:
      tags:
      - Accounts
      summary: Get current profile
      operationId: getMyProfile
      x-required-roles: Authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      security:
      - bearerAuth: []
  /users:
    get:
      tags:
      - Accounts
      summary: List staff accounts
      operationId: listEmployees
      x-required-roles: ADMIN or authorized RESTAURANT_MANAGER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - items
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: role
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
  /users/{userId}/role:
    patch:
      tags:
      - Accounts
      summary: Modify employee role
      operationId: changeUserRole
      x-required-roles: ADMIN or authorized RESTAURANT_MANAGER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      description: Permission to grant elevated roles is a team policy decision. Never allow self-escalation.
  /orders:
    post:
      tags:
      - Orders
      summary: Place food order and initiate payment
      operationId: createOrder
      x-required-roles: Public / CUSTOMER
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                orderId: 123e4567-e89b-12d3-a456-426614174001
                status: PENDING_PAYMENT
                items:
                - dishId: 123e4567-e89b-12d3-a456-426614174000
                  name: Pasta
                  quantity: 2
                  unitPriceAmountMinor: 3500
                deliveryAddress:
                  street: Example Street 10
                  city: Warsaw
                  postalCode: 00-001
                  country: PL
                totalAmountMinor: 7000
                currency: PLN
                paymentStatus: PENDING
                createdAt: '2026-11-20T17:30:00+01:00'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            example:
              items:
              - dishId: 123e4567-e89b-12d3-a456-426614174000
                quantity: 2
              deliveryAddress:
                street: Example Street 10
                city: Warsaw
                postalCode: 00-001
                country: PL
              contact:
                name: Example Guest
                phone: '+48123456789'
              paymentMethodToken: pm_example_123
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      security:
      - {}
      - bearerAuth: []
      description: 'ASSUMPTION: asynchronous payment; response creates PENDING_PAYMENT order. Provider webhook confirms
        or fails payment. Do not assume immediate CONFIRMED status. Token in body refers to provider, not raw card
        credentials.'
    get:
      tags:
      - Orders
      summary: List operational orders
      operationId: listOrders
      x-required-roles: RESTAURANT_MANAGER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - items
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
  /orders/{orderId}:
    get:
      tags:
      - Orders
      summary: Get order details and tracking status
      operationId: getOrder
      x-required-roles: CUSTOMER owner / MANAGER / guest with lookup token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Guest-Lookup-Token
        in: header
        required: false
        schema:
          type: string
      security:
      - {}
      - bearerAuth: []
      description: Guest order retrieval requires an opaque secret lookup token; bearer token not obligatory for
        that mode.
  /users/me/orders:
    get:
      tags:
      - Orders
      summary: List previous customer orders
      operationId: getMyOrders
      x-required-roles: CUSTOMER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - items
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
  /orders/{orderId}/status:
    patch:
      tags:
      - Orders
      summary: Update fulfillment status
      operationId: updateOrderStatus
      x-required-roles: RESTAURANT_MANAGER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /orders/{orderId}/cancel:
    post:
      tags:
      - Orders
      summary: Cancel eligible order
      operationId: cancelOrder
      x-required-roles: CUSTOMER owner / MANAGER / authorized guest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReason'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - {}
      - bearerAuth: []
  /orders/{orderId}/payment:
    get:
      tags:
      - Payments
      summary: Read payment status without card data
      operationId: getOrderPayment
      x-required-roles: CUSTOMER owner / MANAGER / authorized guest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - {}
      - bearerAuth: []
  /payments/webhooks:
    post:
      tags:
      - Payments
      summary: Receive verified payment provider event
      operationId: paymentWebhook
      x-required-roles: Verified payment provider
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhook'
      parameters:
      - name: X-Provider-Signature
        in: header
        required: true
        schema:
          type: string
      security: []
      description: Verify HMAC/provider signature, eventId idempotency and the payment/order reference. Unlike user
        auth, this route uses provider signature verification.
  /reservations/availability:
    get:
      tags:
      - Reservations
      summary: Check reservation availability
      operationId: checkReservationAvailability
      x-required-roles: Public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: time
        in: query
        required: true
        schema:
          type: string
      - name: amountOfPeople
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      security: []
  /reservations:
    post:
      tags:
      - Reservations
      summary: Create a reservation atomically
      operationId: createReservation
      x-required-roles: Public / CUSTOMER
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
            example:
              date: '2026-11-20'
              time: '18:00'
              amountOfPeople: 4
              contact:
                name: Example Guest
                phone: '+48123456789'
                email: guest@example.com
      security:
      - {}
      - bearerAuth: []
      description: Booking operation rechecks overlapping reservations atomically; concurrent conflict -> 409 even
        if an earlier availability query said available.
    get:
      tags:
      - Reservations
      summary: List upcoming reservations
      operationId: listReservations
      x-required-roles: RESTAURANT_MANAGER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - items
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
